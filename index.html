<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>53期 上期 考課評価システム｜千房ホールディングス</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">53期 上期 考課評価システム</div>
    <div class="topbar-sub">千房ホールディングス株式会社 営業推進本部</div>
  </div>
  <div class="topbar-right">
    <span class="saved-badge" id="savedBadge">✓ 保存済み</span>
    <button class="btn-primary sm" id="globalSaveBtn" onclick="App.globalSave()">💾 一括保存</button>
  </div>
</div>

<nav class="nav" id="nav"></nav>

<main class="content" id="content">
  <div class="loading">
    <div class="spinner"></div>
    <p>データを読み込んでいます…</p>
  </div>
</main>

<div id="toast"></div>

<div class="modal-bg" id="masterModal" onclick="if(event.target===this)App.closeMasterModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">課題・KPI編集</div>
    <div id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="App.closeMasterModal()">キャンセル</button>
      <button class="btn-primary"   onclick="App.saveMasterFromModal()">保存する</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
