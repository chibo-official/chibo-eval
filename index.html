<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>53期 上期 考課評価システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'游ゴシック','Yu Gothic',Meiryo,sans-serif;font-size:15px;color:#222;background:#f5f5f5;min-height:100vh}

/* ─── トップバー ─── */
.topbar{background:#8B0000;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-size:17px;font-weight:bold}
.topbar-sub{font-size:13px;opacity:.75;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.badge-saved{font-size:12px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:4px;display:none}
.badge-saved.show{display:inline}

/* ─── ナビゲーション ─── */
.nav{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;gap:0;overflow-x:auto;white-space:nowrap;position:sticky;top:54px;z-index:99}
.nav-btn{padding:13px 18px;font-size:14px;border:none;background:none;cursor:pointer;color:#555;border-bottom:3px solid transparent;font-family:inherit;transition:color .15s}
.nav-btn:hover{color:#8B0000;background:#fdf5f5}
.nav-btn.active{color:#8B0000;border-bottom-color:#8B0000;font-weight:bold}

/* ─── コンテンツエリア ─── */
.content{max-width:1300px;margin:0 auto;padding:20px 16px}

/* ─── カード ─── */
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:18px 20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:bold;color:#8B0000;border-bottom:1px solid #f0e0e0;padding-bottom:9px;margin-bottom:16px}

/* ─── メトリクスグリッド ─── */
.metric-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.metric{background:#fafafa;border:1px solid #e8e8e8;border-radius:6px;padding:14px 16px}
.metric-label{font-size:12px;color:#777;margin-bottom:6px}
.metric-val{font-size:24px;font-weight:bold;color:#8B0000}

/* ─── テーブル共通 ─── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{background:#8B0000;color:#fff;padding:10px 12px;text-align:left;font-weight:bold;white-space:nowrap}
thead th.mid{background:#1a4070}
thead th.fin{background:#1a5a2a}
tbody td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tbody tr:hover td{background:#fdf8f8}
tbody tr:last-child td{border-bottom:none}
.tr-member-first td{border-top:2px solid #f0e0e0}

/* ─── バッジ・タグ ─── */
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:13px;font-weight:bold;min-width:32px;text-align:center}
.rank-S{background:#8B0000;color:#fff}.rank-A{background:#1565C0;color:#fff}
.rank-B{background:#2E7D32;color:#fff}.rank-C{background:#E65100;color:#fff}
.rank-D{background:#B71C1C;color:#fff}
.weight-tag{background:#FFF8E7;color:#7A4A00;font-size:13px;padding:3px 8px;border-radius:3px;font-weight:bold}

/* ─── フォーム要素 ─── */
select.grade{border:1px solid #ccc;border-radius:4px;padding:5px 7px;font-size:14px;font-family:inherit;background:#fff;width:68px;cursor:pointer}
select.grade:focus{outline:none;border-color:#8B0000}
select.grade.has-val{border-color:#8B0000;font-weight:bold}
input.comment{border:1px solid #ddd;border-radius:4px;padding:6px 9px;font-size:13px;font-family:inherit;width:100%;background:#fafafa}
input.comment:focus{outline:none;border-color:#8B0000;background:#fff}
input.text-inp{border:1px solid #ddd;border-radius:4px;padding:6px 9px;font-size:13px;font-family:inherit;width:100%}
input.text-inp:focus{outline:none;border-color:#8B0000}
input.num-inp{border:1px solid #ddd;border-radius:4px;padding:6px 9px;font-size:13px;font-family:inherit;width:72px;text-align:right}
input.num-inp:focus{outline:none;border-color:#8B0000}

/* ─── ボタン ─── */
.btn-primary{background:#8B0000;color:#fff;border:none;border-radius:6px;padding:10px 22px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:bold;transition:background .15s}
.btn-primary:hover{background:#6B0000}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-secondary{background:#fff;color:#333;border:1px solid #ccc;border-radius:6px;padding:9px 18px;font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-secondary:hover{background:#f5f5f5}
.btn-link{background:none;border:none;cursor:pointer;color:#8B0000;font-size:14px;text-decoration:underline;font-family:inherit;padding:0}

/* ─── 個人シート ─── */
.member-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.avatar{width:48px;height:48px;border-radius:50%;background:#F5E6E6;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:#8B0000;flex-shrink:0;border:2px solid #e8d0d0}
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.score-card{background:#fafafa;border:1px solid #e8e8e8;border-radius:6px;padding:14px 16px;text-align:center}
.score-card.mid{border-top:3px solid #1a4070}
.score-card.fin{border-top:3px solid #1a5a2a}
.score-card.total{border-top:3px solid #8B0000}
.score-label{font-size:12px;color:#777;margin-bottom:5px}
.score-val{font-size:26px;font-weight:bold}
.score-val.mid{color:#1a4070}
.score-val.fin{color:#1a5a2a}
.score-val.red{color:#8B0000}
.progress{height:5px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}
.pf-mid{background:#1a4070}.pf-fin{background:#1a5a2a}.pf-red{background:#8B0000}

/* ─── 課題一覧 ─── */
.kpi-text{font-size:12px;color:#555;line-height:1.6;max-width:300px}

/* ─── ローディング ─── */
.loading{text-align:center;padding:60px 20px;color:#999;font-size:15px}
.loading-spinner{display:inline-block;width:34px;height:34px;border:3px solid #eee;border-top-color:#8B0000;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── トースト ─── */
#toast{position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:11px 20px;border-radius:6px;font-size:14px;display:none;z-index:999;max-width:320px}
#toast.error{background:#8B0000}
#toast.success{background:#2E7D32}

/* ─── モーダル ─── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:10px;padding:24px;width:min(740px,95vw);max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:bold;color:#8B0000;margin-bottom:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ─── フッターアクション ─── */
.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #eee}

/* ─── 未保存ピル ─── */
.pending-pill{background:#FFF3CD;color:#856404;font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid #FFECB5}

@media(max-width:640px){
  .content{padding:12px 10px}
  .topbar-title{font-size:15px}
  .nav-btn{padding:10px 12px;font-size:13px}
  table{font-size:13px}
  .priority-grid{grid-template-columns:1fr}
}

/* ─── ミッション・重点課題ブロック ─── */
.corp-goal{background:#8B0000;color:#fff;border-radius:8px;padding:13px 20px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.corp-goal-label{font-size:12px;font-weight:bold;opacity:.8;white-space:nowrap;letter-spacing:.06em;border-right:1px solid rgba(255,255,255,.3);padding-right:16px}
.corp-goal-val{font-size:20px;font-weight:bold}
.mission-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:16px 20px;margin-bottom:12px}
.mission-sec-title{font-size:11px;font-weight:bold;color:#8B0000;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.mission-sec-title::before{content:'';display:inline-block;width:3px;height:13px;background:#8B0000;border-radius:2px;flex-shrink:0}
.mission-list{display:flex;flex-direction:column;gap:7px}
.mission-item{font-size:14px;color:#222;padding-left:16px;position:relative;line-height:1.65}
.mission-item::before{content:'';position:absolute;left:4px;top:8px;width:5px;height:5px;background:#8B0000;border-radius:50%}
.priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.priority-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:15px 16px;border-top:3px solid #8B0000}
.priority-num{font-size:11px;font-weight:bold;color:#8B0000;margin-bottom:5px;letter-spacing:.05em}
.priority-name{font-size:16px;font-weight:bold;color:#222;margin-bottom:3px;line-height:1.3}
.priority-sub{font-size:12px;color:#777;margin-bottom:10px}
.priority-tags{display:flex;flex-wrap:wrap;gap:4px}
.priority-tag{background:#F5E6E6;color:#8B0000;font-size:12px;padding:3px 9px;border-radius:4px;font-weight:bold}

/* ─── 課題リンクボタン ─── */
.kpi-link-btn{
  display:inline-block;margin-top:6px;
  background:#8B0000;color:#fff;
  font-size:12px;font-weight:bold;
  padding:4px 12px;border-radius:4px;
  text-decoration:none;
  transition:background .15s;
}
.kpi-link-btn:hover{background:#6B0000}

/* ─── プロセス評価基準テキスト ─── */
.proc-criteria{
  font-size:11px;color:#444;line-height:1.7;
  max-width:340px;white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">53期 上期 考課評価システム</div>
    <div class="topbar-sub">千房ホールディングス株式会社 営業推進本部</div>
  </div>
  <div class="topbar-right">
    <span class="badge-saved" id="savedBadge">✓ 保存済み</span>
    <button class="btn-primary" id="globalSaveBtn" onclick="globalSave()" style="padding:8px 18px;font-size:13px">💾 保存</button>
  </div>
</div>

<div class="nav" id="nav"></div>
<div class="content" id="content">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div>データを読み込んでいます...</div>
  </div>
</div>

<div id="toast"></div>

<div class="modal-bg" id="masterModal">
  <div class="modal">
    <div class="modal-title" id="masterModalTitle">課題・KPI編集</div>
    <div id="masterModalBody"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeMasterModal()">キャンセル</button>
      <button class="btn-primary" onclick="saveMasterFromModal()">保存する</button>
    </div>
  </div>
</div>

<script>
// ======================================================
// 定数・グローバル状態
// ======================================================
const PROC_ITEMS = [
  {
    key:'challenge', label:'☆Challenge', sub:'おもろいことに挑戦するんや',
    desc:'A:0→1の新しい価値を組織にもたらす挑戦を自発的に行い、成果または影響を生み出している　B:現状を大きく進化させる（1→100）取り組みや個人の成長を伴う挑戦を継続的に行っている　C:与えられた課題に対しては取り組むが、挑戦の視点や自己成長への意識が弱い　D:新しいことへの挑戦を避け、変化に対して消極的な姿勢が見られる'
  },
  {
    key:'human', label:'☆Human', sub:'世話焼きでは負けへんで',
    desc:'A:当社ならではの温かい接客・対応を徹底し、顧客・業者ともに強い信頼関係を築いている　B:基本的な接客や対応ができており、顧客・業者との良好な関係を築けている　C:指示されたことをこなすが、特別な気配りや当社らしい「世話焼き」の姿勢は弱い　D:受動的な対応が多く、顧客・業者との関係構築ができていない'
  },
  {
    key:'idea', label:'☆Idea', sub:'常識になんでやねん',
    desc:'A:常識にとらわれない斬新なアイディアを生み出し、実行し、大きな成果を生み出している　B:新しいアイディアを考え、実行しようと努力し、一定の成果を上げている　C:アイディアを考えることはあるが、実行や成果への結びつきが弱い　D:新しいアイディアの発想がなく、実行もせず、成果を生み出していない'
  },
  {
    key:'borderless', label:'☆Borderless', sub:'みんな違うからええんや',
    desc:'A:多様な働き方・価値観を理解し、部署間の垣根を越えて社内環境を整え、組織全体の活性化に貢献している　B:多様性を考慮した業務改善に取り組み、組織の成長に貢献している　C:基本的な業務はこなしているが、多様な価値観、部門間での協働の意識が低い　D:決められた仕事をこなすだけで、組織の多様性や成長に全く寄与していない'
  },
  {
    key:'family', label:'☆One family', sub:'千房という家族やねん',
    desc:'A:お客様・従業員・業者様と深い信頼関係を築き、チームの一体感を高めながら主体的に行動し、職場をより良くするための工夫や発信ができている　B:職場の仲間や関係者とのつながりを大切にし、支え合いながら業務に取り組み、前向きな姿勢を持って働いている　C:基本的な業務はこなしているが、仲間との連携やエンゲージメントの意識が薄い　D:周囲とのつながりを意識せず、個人プレーが目立ち、職場の雰囲気を悪くする行動が見られる'
  },
];
const GR = {A:1, B:5/6, C:4/6, D:3/6, E:2/6};

// 施策名 → 外部リンクURL のマッピング（必要な施策のみ定義）
const KPI_URLS = {
  'メニュー開発課題': 'https://docs.google.com/spreadsheets/d/1sTKj2NTp6eI-kOJ_0-0Dj1Mw3zyEAH6dhdm9ra_QKCY/edit?gid=1294951396#',
  '購買課題':        'https://docs.google.com/spreadsheets/d/1Laqb72UbQkEFKUsnlUnTTtMrOHTTtvZen4F1ky-AYKE/edit?gid=2025405738#gid=2025405738',
};

let MEMBERS = [];
let stateMap = {};
let currentTab = 'summary';
let pendingChanges = {};

// ======================================================
// 起動・データ読み込み
// ======================================================
window.onload = function() { loadAll(); };

function loadAll() {
  google.script.run
    .withSuccessHandler(onMasterLoaded)
    .withFailureHandler(onError)
    .getMaster();
}

function onMasterLoaded(raw) {
  const res = JSON.parse(raw);
  if (!res.ok) { showToast('マスタ読み込みエラー: ' + res.error, 'error'); return; }
  MEMBERS = res.members;
  MEMBERS.forEach(m => {
    stateMap[m.id] = {
      kpis: m.kpis.map(() => ({midGrade:'', midComment:'', finGrade:'', finComment:''})),
      proc: PROC_ITEMS.map(() => ({midGrade:'', midComment:'', finGrade:'', finComment:''})),
    };
  });
  google.script.run
    .withSuccessHandler(onScoresLoaded)
    .withFailureHandler(onError)
    .getAllScores();
}

function onScoresLoaded(raw) {
  const res = JSON.parse(raw);
  if (!res.ok) { showToast('評価データ読み込みエラー: ' + res.error, 'error'); return; }
  res.scores.forEach(s => {
    const st = stateMap[s.member_id];
    if (!st) return;
    const idx = Number(s.item_index);
    if (s.type === 'kpi' && st.kpis[idx]) {
      if (s.phase === 'mid') { st.kpis[idx].midGrade = s.grade; st.kpis[idx].midComment = s.comment; }
      else                   { st.kpis[idx].finGrade = s.grade; st.kpis[idx].finComment = s.comment; }
    } else if (s.type === 'proc' && st.proc[idx]) {
      if (s.phase === 'mid') { st.proc[idx].midGrade = s.grade; st.proc[idx].midComment = s.comment; }
      else                   { st.proc[idx].finGrade = s.grade; st.proc[idx].finComment = s.comment; }
    }
  });
  renderApp();
}

function onError(e) {
  showToast('エラー: ' + (e.message || e), 'error');
  document.getElementById('content').innerHTML =
    '<div class="loading" style="color:#8B0000">読み込みに失敗しました。<br>ページを再読み込みしてください。</div>';
}

// ======================================================
// スコア計算
// ======================================================
function calcKpi(mid, phase) {
  const m = MEMBERS.find(x => x.id === mid);
  const s = stateMap[mid];
  let total = 0, any = false;
  m.kpis.forEach((k, i) => {
    const g = phase === 'mid' ? s.kpis[i].midGrade : s.kpis[i].finGrade;
    if (g) { any = true; total += k.weight / 100 * 60 * (GR[g] || 0); }
  });
  return any ? total : null;
}
function calcProc(mid, phase) {
  const s = stateMap[mid];
  let t = 0, any = false;
  s.proc.forEach(p => {
    const g = phase === 'mid' ? p.midGrade : p.finGrade;
    if (g) { any = true; t += 8 * (GR[g] || 0); }
  });
  return any ? t : null;
}
function rank(pts) {
  if (pts === null || pts === undefined) return '';
  if (pts >= 90) return 'S'; if (pts >= 80) return 'A';
  if (pts >= 70) return 'B'; if (pts >= 60) return 'C'; return 'D';
}
function fmt(v) { return v === null ? '—' : v.toFixed(1); }
function kpiPts(k, grade) { return grade ? k.weight / 100 * 60 * (GR[grade] || 0) : null; }
function procPts(grade)    { return grade ? 8 * (GR[grade] || 0) : null; }

// ======================================================
// ナビゲーション・ルーティング
// ======================================================
function renderApp() { renderNav(); renderContent(); }

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const tabs = [
    {id:'summary', label:'集計サマリー'},
    {id:'kpilist', label:'課題一覧'},
    ...MEMBERS.map(m => ({id: m.id, label: m.name.replace(' ', '')}))
  ];
  tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'nav-btn' + (currentTab === t.id ? ' active' : '');
    b.textContent = t.label + (pendingChanges[t.id] ? ' *' : '');
    b.onclick = () => { currentTab = t.id; renderApp(); };
    nav.appendChild(b);
  });
}

function renderContent() {
  const c = document.getElementById('content');
  if      (currentTab === 'summary') renderSummary(c);
  else if (currentTab === 'kpilist') renderKpiList(c);
  else {
    const m = MEMBERS.find(x => x.id === currentTab);
    if (m) renderMember(c, m);
  }
}

// ======================================================
// 集計サマリー
// ======================================================
function renderSummary(c) {
  const done = MEMBERS.filter(m => stateMap[m.id].kpis.every(k => k.finGrade)).length;
  const finTotals = MEMBERS.map(m => {
    const fk = calcKpi(m.id,'fin'), fp = calcProc(m.id,'fin');
    return fk !== null && fp !== null ? fk + fp : null;
  }).filter(v => v !== null);
  const avg = finTotals.length ? finTotals.reduce((a,b)=>a+b,0)/finTotals.length : null;

  c.innerHTML = '';

  // ── 全社目標 ──
  const goalBar = mkEl('div','corp-goal');
  goalBar.innerHTML = '<span class="corp-goal-label">全社目標</span><span class="corp-goal-val">営業利益 100,000,000円</span>';
  c.appendChild(goalBar);

  // ── 営業推進本部 MISSION ──
  const missionCard = mkEl('div','mission-card');
  missionCard.innerHTML = `
    <div class="mission-sec-title">営業推進本部の目標・MISSION</div>
    <div class="mission-list">
      <div class="mission-item">FAN創造とLTV最大化を担い、成長事業を支えるブランド基盤を形成する</div>
      <div class="mission-item">FAN基盤の確立を通じて、他部署の展開に好影響を与える中枢機能として組織の成長を牽引する</div>
    </div>`;
  c.appendChild(missionCard);

  // ── 重点課題 ──
  const priorities = [
    { num:'01', name:'FAN基盤の強化', sub:'CX・再来店・CRM', tags:['FAN売上比率UP','Fan活性度UP','成長Fan数UP'] },
    { num:'02', name:'統合価値向上',  sub:'商品・体験・ブランド', tags:['営業利益UP','Fan活性度UP'] },
    { num:'03', name:'新規FAN層獲得', sub:'若年層・ファミリー', tags:['若年比率UP','SNS起因来店'] },
  ];
  const pgrid = mkEl('div','priority-grid');
  priorities.forEach(p => {
    const card = mkEl('div','priority-card');
    const tagsHtml = p.tags.map(t=>`<span class="priority-tag">${t}</span>`).join('');
    card.innerHTML = `

// ======================================================
// 保存処理
// ======================================================
function buildPayload(mid) {
  const m = MEMBERS.find(x=>x.id===mid);
  const s = stateMap[mid];
  const scores = [];
  m.kpis.forEach((_,ki) => {
    const ks = s.kpis[ki];
    scores.push({phase:'mid',type:'kpi',item_index:ki,grade:ks.midGrade,comment:ks.midComment});
    scores.push({phase:'fin',type:'kpi',item_index:ki,grade:ks.finGrade,comment:ks.finComment});
  });
  PROC_ITEMS.forEach((_,pi) => {
    const ps = s.proc[pi];
    scores.push({phase:'mid',type:'proc',item_index:pi,grade:ps.midGrade,comment:ps.midComment});
    scores.push({phase:'fin',type:'proc',item_index:pi,grade:ps.finGrade,comment:ps.finComment});
  });
  return JSON.stringify({memberId:mid, scores:scores.filter(s=>s.grade||s.comment)});
}

function saveMember(mid, btn) {
  if (btn) { btn.disabled=true; btn.textContent='保存中...'; }
  google.script.run
    .withSuccessHandler(res => {
      const r = JSON.parse(res);
      if (r.ok) { delete pendingChanges[mid]; showToast('保存しました ✓','success'); showSavedBadge(); renderNav(); }
      else showToast('保存エラー: '+r.error,'error');
      if (btn) { btn.disabled=false; btn.textContent='💾 この人を保存'; }
    })
    .withFailureHandler(e => {
      showToast('保存失敗: '+(e.message||e),'error');
      if (btn) { btn.disabled=false; btn.textContent='💾 この人を保存'; }
    })
    .saveScores(buildPayload(mid));
}

function globalSave() {
  const ids = Object.keys(pendingChanges);
  if (!ids.length) { showToast('変更はありません',''); return; }
  const btn = document.getElementById('globalSaveBtn');
  btn.disabled=true; btn.textContent='保存中...';
  let done = 0;
  ids.forEach(mid => {
    google.script.run
      .withSuccessHandler(res => {
        const r=JSON.parse(res); if(r.ok) delete pendingChanges[mid];
        if(++done===ids.length){ btn.disabled=false; btn.textContent='💾 保存'; showToast(`${ids.length}名分を保存しました ✓`,'success'); showSavedBadge(); renderNav(); }
      })
      .withFailureHandler(()=>{ if(++done===ids.length){ btn.disabled=false; btn.textContent='💾 保存'; } })
      .saveScores(buildPayload(mid));
  });
}

function markPending(mid) { pendingChanges[mid] = true; renderNav(); }

function showSavedBadge() {
  const b = document.getElementById('savedBadge');
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 3000);
}

// ======================================================
// DOM ユーティリティ
// ======================================================
function mkEl(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function addTd(tr, text, style) {
  const t = document.createElement('td'); t.textContent = text;
  if (style) t.style.cssText = style;
  tr.appendChild(t); return t;
}
function mkGradeSelect(val, onChange) {
  const s = document.createElement('select');
  s.className = 'grade' + (val ? ' has-val' : '');
  ['','A','B','C','D','E'].forEach(g => {
    const o = document.createElement('option'); o.value=g; o.textContent=g||'—';
    if (g===val) o.selected=true; s.appendChild(o);
  });
  s.addEventListener('change', () => {
    s.className = 'grade' + (s.value ? ' has-val' : '');
    onChange(s.value);
  });
  return s;
}
function mkCommentInput(val, onChange) {
  const inp = document.createElement('input');
  inp.type='text'; inp.className='comment'; inp.value=val||''; inp.placeholder='コメント';
  inp.addEventListener('input', ()=>onChange(inp.value));
  return inp;
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className=type||''; t.style.display='block';
  setTimeout(()=>t.style.display='none', 3000);
}

  addBtn.onclick=()=>{
    m.kpis.push({施策:'新しい施策',weight:10,kpi:''});
    stateMap[memberId].kpis.push({midGrade:'',midComment:'',finGrade:'',finComment:''});
    openMasterModal(memberId);
  };
  body.appendChild(addBtn);
  document.getElementById('masterModal').classList.add('show');
}

function closeMasterModal() {
  document.getElementById('masterModal').classList.remove('show');
}

function saveMasterFromModal() {
  const mid = document.getElementById('masterModalBody').dataset.mid;
  const m = MEMBERS.find(x=>x.id===mid);
  document.querySelectorAll('[data-mid="'+mid+'"]').forEach(inp=>{
    const ki=Number(inp.dataset.ki), field=inp.dataset.field;
    if(field==='施策') m.kpis[ki].施策=inp.value;
    if(field==='weight') m.kpis[ki].weight=Number(inp.value)||0;
    if(field==='kpi') m.kpis[ki].kpi=inp.value;
  });
  google.script.run
    .withSuccessHandler(res=>{
      const r=JSON.parse(res);
      if(r.ok){showToast('マスタを保存しました ✓','success');closeMasterModal();renderContent();}
      else showToast('マスタ保存エラー: '+r.error,'error');
    })
    .withFailureHandler(e=>showToast('保存失敗: '+(e.message||e),'error'))
    .saveMaster(JSON.stringify({members:MEMBERS}));
}
</script>
</body>
